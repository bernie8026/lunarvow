<!doctype html>
<html lang="zh-HK" data-vault-gate>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' @@AUTH_ORIGIN@@; worker-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>月下檔案已封存 // Lunar Vow</title>
  <link rel="stylesheet" href="@@ROOT@@_vault/gate.css?v=@@BUILD@@-moon-2">
  <script src="@@ROOT@@_vault/runtime.js?v=@@BUILD@@-passkeys-2" defer></script>
</head>
<body>
  <header class="vault-header">
    <a href="@@ROOT@@" class="vault-wordmark">BR <span>LUNAR VOW ARCHIVE</span></a>
    <nav class="vault-languages" data-vault-languages aria-label="選擇語言">
      <select data-vault-language-select aria-label="Language / 語言"><option value="zh-HK" lang="zh-HK">繁體中文</option><option value="en" lang="en">English</option><option value="zh-CN" lang="zh-CN">简体中文</option><option value="ja" lang="ja">日本語</option><option value="ko" lang="ko">한국어</option><option value="th" lang="th">ไทย</option><option value="ru" lang="ru">Русский</option></select>
    </nav>
  </header>
  <main class="vault-entrance">
    <div class="vault-moon" aria-hidden="true"><div class="vault-moon-disc"></div><span class="vault-orbit"></span><span class="vault-orbit vault-orbit-second"></span></div>
    <section class="vault-intro" aria-labelledby="vault-title">
      <p class="vault-kicker">A PRIVATE CONSTELLATION</p>
      <h1 id="vault-title" data-vault-text="title">月下檔案已封存</h1>
      <p class="vault-description" data-vault-text="intro">用已登記嘅通行密鑰，解鎖完整檔案庫。</p>
      <div class="vault-signature" aria-hidden="true">Lunar Vow<span>CRIMSON LOVE</span></div>
    </section>
    <section class="vault-access" aria-labelledby="vault-access-heading">
      <p id="vault-access-heading" class="vault-eyebrow">CAPTAIN ACCESS</p>
      <div class="vault-passkey-controls" data-vault-passkeys>
        <button type="button" class="vault-submit vault-passkey" data-vault-passkey aria-describedby="vault-passkey-note vault-status" disabled>使用通行密鑰</button>
        <p id="vault-passkey-note" class="vault-note" data-vault-passkey-note>使用 Face ID、Touch ID，或選擇另一部裝置。</p>
        <section class="vault-passkey-setup" data-vault-passkey-setup hidden aria-labelledby="vault-passkey-heading">
          <h2 id="vault-passkey-heading" data-passkey-text="setupTitle">新增你的通行密鑰</h2>
          <p class="vault-note" data-passkey-text="setupHelp"></p>
          <button type="button" class="vault-submit" data-vault-passkey-register disabled>新增通行密鑰</button>
        </section>
      </div>
      <p id="vault-status" class="vault-status" data-vault-status role="status" aria-live="polite">正在準備入口…</p>
      <p class="vault-note" data-vault-text="note">解鎖後可隨時按「鎖定檔案」關閉存取。</p>
      <noscript><p class="vault-status is-error">需要啟用 JavaScript 先可以解鎖。 JavaScript is required to unlock this archive.</p></noscript>
    </section>
  </main>
  <footer class="vault-footer"><span>BERNIE'S HONKAI REALM</span><span>PRIVATE ARCHIVE / LV-001</span></footer>
</body>
</html>
