name: Rebuild Lunar Vow audio

on:
  push:
    branches:
      - agent/replace-truncated-audio
    paths:
      - '.audio-parts/**'
      - '.github/workflows/rebuild-lunar-audio.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replace-truncated-audio
      - name: Check for upload parts
        id: parts
        shell: bash
        run: |
          if [[ -f .audio-parts/part00.b64 ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild and verify binary audio
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          cat .audio-parts/part*.b64 > /tmp/lunar-audio.b64
          base64 --decode /tmp/lunar-audio.b64 > assets/audio/lunar-vow-theme-loop.webm
          test "$(stat -c %s assets/audio/lunar-vow-theme-loop.webm)" -eq 17783
          echo '7e1f43428ad61f5a6598ac6ea79d8b90546316dc022a2df00514d9af5c6dd929  assets/audio/lunar-vow-theme-loop.webm' | sha256sum -c -
          file assets/audio/lunar-vow-theme-loop.webm
      - name: Commit verified audio asset
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/lunar-vow-theme-loop.webm
          git rm -r .audio-parts
          git commit -m 'Rebuild verified Lunar Vow audio asset'
          git push origin HEAD:agent/replace-truncated-audio
