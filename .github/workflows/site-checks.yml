name: Protected archive checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  protected-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:layout
