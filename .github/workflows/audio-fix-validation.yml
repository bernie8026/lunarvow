name: Validate replacement audio

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate player syntax
        run: node --check assets/music-player.js
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Validate audio asset
        shell: bash
        run: |
          set -euxo pipefail
          AUDIO="assets/audio/lunar-vow-theme-loop.webm"
          test "$(stat -c %s "$AUDIO")" -eq 17783
          file "$AUDIO"
          ffprobe -v error \
            -show_entries format=format_name,duration,size \
            -show_entries stream=codec_name,codec_type,sample_rate,channels \
            -of default=noprint_wrappers=1 "$AUDIO"
          ffmpeg -v error -i "$AUDIO" -map 0:a:0 -f null -
          grep -q "lunar-vow-theme-loop.webm" assets/music-player.js
